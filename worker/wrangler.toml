# "Ask the map" v3: the small helper that holds the AI key for the site's question box. Deployed to Cloudflare Workers (free tier).
#   deploy:  cd worker && npx wrangler deploy
#   key:     npx wrangler secret put ANTHROPIC_API_KEY      (pasted once; never in the repository or the site)
#   optional: npx wrangler secret put ASK_SIGNING_SECRET    (HMAC secret for the signed transcript; defaults to a hash of the API key)
# The site (GitHub Pages) calls https://<name>.<account>.workers.dev/ask; see README.md and ASK_CONTRACT.md.
name = "trial-map-ask"
main = "src/index.js"
workers_dev = true
compatibility_date = "2026-10-01"

[vars]
SITE_BASE = "https://nehaamd.github.io/cancer-trial-access-fullmap/"   # reported by /health; the data itself is read by the browser, not the worker
ALLOWED_ORIGINS = "https://nehaamd.github.io,http://localhost:8080,http://localhost:8077"
MODEL = "claude-sonnet-5-5"          # the one model: plans tool calls, reads results, writes the final answer
MODEL_FAST = ""                      # unused: read and ignored by loop.js (a cheaper model for tools-only steps would lose the prompt cache)
MAX_STEPS = "8"                      # model calls per question; the last is forced to final_answer
PER_MINUTE = "12"                    # questions per visitor per minute (best effort, per worker instance; only the first step of a question counts)
DAILY_CAP = "3000"                   # questions per day across visitors (best effort); the spending limit on the key is the hard stop

[observability]
enabled = true                       # question text, step, kind, model, verification result and token usage appear in the dashboard logs (no visitor identifiers are logged)
