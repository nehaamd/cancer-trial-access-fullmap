# Scheduled registry refresh (weekly) — rebuilds the trial-dependent stages and publishes docs/.
# STATUS: written for GitHub Actions but NOT executed from the build environment; run it once manually (Actions → Refresh → Run workflow)
# and read the log before trusting the schedule. Reference data (Census roads/tracts, State Cancer Profiles, ACS) are rebuilt only
# when their scripts are run by hand — they change yearly, not weekly.
name: Refresh registry data
on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * 1"   # Mondays 11:00 UTC
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Restore road graph (rebuilt if the cache is empty; ~5 min, ~300 MB download)
        uses: actions/cache@v4
        with: { path: data/roads, key: roads-tiger2025-v1 }
      - run: test -f data/roads/graph_us.npz || python build_roads_us.py
      - name: Restore Census boundary files (downloaded if the cache is empty, ~34 MB; county 2023 + 2021 for Connecticut, districts 119th, states)
        uses: actions/cache@v4
        with: { path: data/geo, key: geo-cb2023-cb2021-cd119-states-v1 }
      - run: |
          mkdir -p data/geo
          test -f data/geo/cb.zip         || curl -sSfL --retry 3 -o data/geo/cb.zip         https://www2.census.gov/geo/tiger/GENZ2023/shp/cb_2023_us_county_500k.zip
          test -f data/geo/cb500_2021.zip || curl -sSfL --retry 3 -o data/geo/cb500_2021.zip https://www2.census.gov/geo/tiger/GENZ2021/shp/cb_2021_us_county_500k.zip
          test -f data/geo/cd119.zip      || curl -sSfL --retry 3 -o data/geo/cd119.zip      https://www2.census.gov/geo/tiger/GENZ2024/shp/cb_2024_us_cd119_500k.zip
          test -f data/geo/states.zip     || curl -sSfL --retry 3 -o data/geo/states.zip     https://www2.census.gov/geo/tiger/GENZ2023/shp/cb_2023_us_state_500k.zip
          ls -la data/geo
      - name: Snapshot the previous pull
        run: |
          d=$(python -c "import json;print(json.load(open('data/raw/fetch_log.json'))['timestamp_utc'][:10])")
          mkdir -p data/snapshots/$d && cp data/raw/trials.csv data/raw/us_sites.csv data/raw/fetch_log.json data/raw/trial_cancer_type.csv out_adult55/county_metrics.csv out_adult55/national_metrics_v3.json out_adult55/state_metrics_v3.csv data/snapshots/$d/ || true
      - name: Refresh chain
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}   # optional; govinfo BILLSTATUS needs no key
        run: sh run_refresh.sh
      - run: python diff_snapshots.py
      - name: Commit and publish
        run: |
          git config user.name "refresh-bot"; git config user.email "refresh-bot@users.noreply.github.com"
          git add -A docs RELEASE_GATE.md audit_allowlist.txt data/raw/trials.csv data/raw/us_sites.csv data/raw/fetch_log.json data/raw/trial_cancer_type.csv data/snapshots out_adult55/*.csv out_adult55/*.json out_adult55/*.md VALIDATION_v3.md VALIDATION_extras.md cosponsors_raw.json rucc_log.json burden_log.json
          git commit -m "Registry refresh $(date -u +%F)" || echo "nothing to commit"
          git push
