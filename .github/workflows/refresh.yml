# Scheduled registry refresh (weekly) — rebuilds the trial-dependent stages and publishes docs/.
# Run it by hand from the Actions tab ("Refresh registry data" -> "Run workflow") after any change to the pipeline and read the
# result before trusting the schedule: if a step fails, the last lines of its output are shown on the run's summary page.
# Reference data (Census tracts, State Cancer Profiles, ACS) are rebuilt only when their scripts are run by hand — they change
# yearly, not weekly. The road graph is rebuilt automatically when its rules change (GRAPH_VERSION in build_roads_us.py).
name: Refresh registry data
on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * 1"   # Mondays 11:00 UTC
permissions:
  contents: write
# Both workflows push to main on Mondays (registry 11:00 UTC, cosponsors 12:17 UTC): one waits for the other instead of racing it to the push.
concurrency: { group: publish-main, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-24.04   # pinned: the ubuntu-latest label moves to Ubuntu 26 from 19 October 2026 (a Monday, the scheduled day); move deliberately, after a run by hand
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Restore Census boundary files (downloaded if the cache is empty, ~34 MB; county 2023 + 2021 for Connecticut, districts 119th, states)
        uses: actions/cache@v4
        with: { path: data/geo, key: geo-cb2023-cb2021-cd119-states-v1 }
      - run: |
          mkdir -p data/geo
          test -f data/geo/cb.zip         || curl -sSfL --retry 3 -o data/geo/cb.zip         https://www2.census.gov/geo/tiger/GENZ2023/shp/cb_2023_us_county_500k.zip
          test -f data/geo/cb500_2021.zip || curl -sSfL --retry 3 -o data/geo/cb500_2021.zip https://www2.census.gov/geo/tiger/GENZ2021/shp/cb_2021_us_county_500k.zip
          test -f data/geo/cd119.zip      || curl -sSfL --retry 3 -o data/geo/cd119.zip      https://www2.census.gov/geo/tiger/GENZ2024/shp/cb_2024_us_cd119_500k.zip
          test -f data/geo/states.zip     || curl -sSfL --retry 3 -o data/geo/states.zip     https://www2.census.gov/geo/tiger/GENZ2023/shp/cb_2023_us_state_500k.zip
          ls -la data/geo
      # The road graph needs the county boundaries above. The key carries GRAPH_VERSION from build_roads_us.py: change both together.
      # build_roads_us.py --if-stale also checks the version stored inside the cached graph, so a stale cache is rebuilt, never used.
      - name: Restore road graph (rebuilt if the cache is empty or its rules changed; ~6 min, ~300 MB download)
        uses: actions/cache@v4
        with: { path: data/roads, key: roads-tiger2025-graph-v2 }
      - run: python build_roads_us.py --if-stale
      # run_refresh.sh first keeps the pull being replaced in data/snapshots/<its date>/, and builds changes.js (diff_snapshots.py) before the
      # validation and the release gate, so both check the new comparison and VALIDATION_v3.md reports it (until October 2026 the snapshot and
      # the diff were separate steps here, and the diff ran after the gate: the published validation described the previous refresh's diff)
      - name: Refresh chain
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}   # optional; govinfo BILLSTATUS needs no key
        shell: bash
        run: |
          set -o pipefail
          sh run_refresh.sh 2>&1 | tee refresh.log
      - name: If the chain failed, show where (the end of its output, on the run's summary page)
        if: failure()
        shell: bash
        run: |
          test -f refresh.log || exit 0
          { echo '### The refresh stopped here — nothing was published'; echo; echo '```'; tail -n 60 refresh.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Refresh chain failed (last lines of its output)::$(tail -n 25 refresh.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | cut -c1-3500)"
      - name: Redraw the link-preview image and the findings-page map from the new data (a failure here does not stop the refresh)
        continue-on-error: true
        run: |
          pip install -q playwright pillow && python -m playwright install --with-deps chromium
          python make_assets.py
      # every file the chain writes and a page, a validator or the next refresh reads; trials_raw.csv / us_sites_raw.csv (the unscreened pull,
      # kept by qc_us.py) and mortality_log.json were missing until October 2026, so the copies in the repository were from 1 and 6 October
      - name: Commit and publish
        run: |
          git config user.name "refresh-bot"; git config user.email "refresh-bot@users.noreply.github.com"
          git add -A docs out RELEASE_GATE.md README.md audit_allowlist.txt data/raw/trials.csv data/raw/us_sites.csv data/raw/trials_raw.csv data/raw/us_sites_raw.csv data/raw/fetch_log.json data/raw/trial_cancer_type.csv data/snapshots out_adult55/*.csv out_adult55/*.json out_adult55/*.md VALIDATION_v3.md VALIDATION_extras.md cosponsors_raw.json rucc_log.json burden_log.json mortality_log.json oncologists_build_log.json \
                     data/ref/nci_centers.csv data/ref/legislators-current.json data/ref/legislators_log.json data/roads/graph_stats.json
          git commit -m "Registry refresh $(date -u +%F)" || echo "nothing to commit"
          git push
